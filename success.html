<body class="status-page status-page--center">
  <noscript>
    <div><img src="https://mc.yandex.ru/watch/106969126" style="position:absolute; left:-9999px;" alt="" /></div>
  </noscript>

  <main class="status-shell">
    <section class="status-card status-card--payment">
      <div class="status-card__head">
        <div class="status-state-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 12.5l3.1 3.1L17.5 8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <p class="status-preview-note" id="statusPreviewNote" hidden>Предпросмотр</p>
        <p class="status-kicker" id="statusKicker">Проверка операции</p>
        <h1 class="status-title" id="statusTitle">Оплата обрабатывается</h1>
        <p class="status-text" id="statusLead">Проверяем подтверждение платёжной системы.</p>
      </div>

      <div class="status-summary" aria-label="Информация о заказе">
        <div class="status-summary__item"><span>Сервис</span><strong id="serviceName">-</strong></div>
        <div class="status-summary__item"><span>Заказ</span><strong id="orderId">-</strong></div>
        <div class="status-summary__item"><span>Email</span><strong id="emailMasked">-</strong></div>
        <div class="status-summary__item"><span>Сумма</span><strong id="amount">-</strong></div>
      </div>

      <div class="status pending" id="statusText">Ожидаем подтверждение платежа...</div>
      <div class="status-redirect" id="statusRedirect">
        <span class="status-redirect__spinner" aria-hidden="true"></span>
        <span id="statusRedirectText">После подтверждения откроем страницу активации.</span>
      </div>
      <div class="actions">
        <a class="btn primary" href="/">На главную</a>
        <a class="btn" id="tariffLink" href="/#pricing">К тарифам</a>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = String(params.get("order_id") || params.get("orderId") || "").trim();
    const linkToken = String(params.get("t") || "").trim();
    const previewMode = String(params.get("preview") || "").trim().toLowerCase() === "paid";
    const previewServiceKey = normalizeServiceKey(params.get("service"));
    const LAST_PAID_ORDER_KEY = "gptishka_last_paid_order_id";
    const METRIKA_COUNTER_ID = 106969126;
    const CART_STORAGE_KEYS = [
      "gptishka_cart_v1",
      "gptishka_card_qty_v1",
      "selected_cart",
      "gptishka_cart_promo_v1",
      "selected_product",
    ];

    const orderIdEl = document.getElementById("orderId");
    const statusTitleEl = document.getElementById("statusTitle");
    const statusLeadEl = document.getElementById("statusLead");
    const statusKickerEl = document.getElementById("statusKicker");
    const serviceNameEl = document.getElementById("serviceName");
    const statusPreviewNoteEl = document.getElementById("statusPreviewNote");
    const tariffLinkEl = document.getElementById("tariffLink");
    const statusRedirectTextEl = document.getElementById("statusRedirectText");
    const emailMaskedEl = document.getElementById("emailMasked");
    const amountEl = document.getElementById("amount");
    const statusEl = document.getElementById("statusText");
    const SUPPORT_WIDGET_SELECTORS = [
      "#gptishka-support-widget",
      ".support-widget",
      ".gptishka-support-widget",
      "[data-support-widget]",
      "[data-widget='support']",
      ".assistant-widget",
      ".gptishka-assistant-widget",
    ];

    removeInjectedSupportUi();
    const supportObserver = new MutationObserver(() => {
      removeInjectedSupportUi();
    });
    supportObserver.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(() => supportObserver.disconnect(), 35000);

    const initialServiceKey = previewServiceKey || resolveServiceKey(null);
    applyServiceContext(initialServiceKey);

    if (previewMode && previewServiceKey) {
      renderPaidPreview(previewServiceKey);
    } else if (!orderId) {
      orderIdEl.textContent = "не найден";
      statusEl.className = "status failed";
      statusEl.textContent = "Не удалось определить order_id. Откройте оплату заново.";
      setNextStep("Оформите заказ заново", "Вернитесь к тарифам, выберите нужный сервис и повторите оформление.");
    } else {
      orderIdEl.textContent = orderId;
      try {
        localStorage.setItem("gptishka_activation_order_id", orderId);
        if (linkToken) localStorage.setItem(`gptishka_activation_order_token:${orderId}`, linkToken);
      } catch (_) {
        // Ignore storage write errors.
      }
      pollOrderStatus(orderId);
    }

    async function pollOrderStatus(id) {
      const startedAt = Date.now();
      const timeoutMs = 30000;
      const intervalMs = 2000;

      while (Date.now() - startedAt <= timeoutMs) {
        const done = await requestStatus(id);
        if (done) return;
        await wait(intervalMs);
      }

      statusEl.className = "status pending";
      statusEl.textContent = "Платеж еще в обработке. Обновите страницу через несколько секунд.";
    }

    async function requestStatus(id) {
      try {
        const response = await fetch(`/api/orders/${encodeURIComponent(id)}/reconcile`, { cache: "no-store" });
        if (!response.ok) return false;
        const payload = await response.json();

        const status = String(payload?.status || "PENDING").toUpperCase();
        const paymentStatus = String(payload?.paymentStatus || "").toUpperCase();
        const amount = Number(payload?.finalAmount || 0);
        const currency = String(payload?.currency || "RUB");
        const deliveryMode = String(payload?.deliveryMode || "activation").trim().toLowerCase();
        const serviceKey = resolveServiceKey(payload);
        const service = applyServiceContext(serviceKey);

        if (serviceKey === "steam" && paymentStatus !== "SUCCESS") {
          setNextStep(
            "Ожидаем подтверждение оплаты",
            "После подтверждения передадим ключи по указанной Steam trade-ссылке."
          );
        }

        if (payload?.emailMasked) emailMaskedEl.textContent = payload.emailMasked;
        amountEl.textContent = `${formatAmount(amount)} ${currency}`;

        if (status === "PAID") {
          if (paymentStatus === "SUCCESS") trackConfirmedPurchase(id, payload);
          trackPurchaseRecord(id, payload);
          handlePaidOrder(id);
          if (deliveryMode === "vpn") {
            setPaidReceipt(service, `Доступ ${service.name} готовится к подключению.`);
            statusEl.className = "status paid";
            statusEl.textContent = "Платёж подтверждён. Подготавливаем страницу активации.";
            setNextStep("Откроется активация VPN", "Страница переключится автоматически — повторно оплачивать заказ не нужно.");
            try {
              localStorage.setItem("gptishka_vpn_order_id", id);
              if (linkToken) localStorage.setItem(`gptishka_vpn_order_token:${id}`, linkToken);
            } catch (_) {
              // Ignore storage write errors.
            }
            setTimeout(() => {
              const url = new URL("/store/vpn/activate", window.location.origin);
              url.searchParams.set("order_id", id);
              if (linkToken) url.searchParams.set("t", linkToken);
              window.location.href = url.toString();
            }, 1200);
            return true;
          }

          if (deliveryMode === "code") {
            setPaidReceipt(service, `Цифровой товар ${service.name} успешно оплачен.`);
            statusEl.className = "status paid";
            statusEl.textContent = "Платёж подтверждён. Подготавливаем страницу выдачи.";
            setNextStep("Откроется выданный код", "Страница с цифровым кодом загрузится автоматически.");
            setTimeout(() => {
              const url = new URL("/itunes", window.location.origin);
              url.searchParams.set("order_id", id);
              if (linkToken) url.searchParams.set("t", linkToken);
              window.location.href = url.toString();
            }, 900);
            return true;
          }

          if (deliveryMode === "manual_login") {
            if (serviceKey === "steam") {
              setPaidReceipt(service, "Оплата подтверждена. Заказ Steam передан менеджеру.");
              statusEl.className = "status paid";
              statusEl.textContent = "Платёж подтверждён. Передаём ключи по указанной trade-ссылке.";
              setNextStep(
                "Заказ передан в обработку",
                "Ключи будут переданы на указанную Steam trade-ссылку. Статус сообщим в Telegram."
              );
              return true;
            }
            setPaidReceipt(service, `Заказ ${service.name} создан и передан в обработку.`);
            statusEl.className = "status paid";
            statusEl.textContent = "Платёж подтверждён. Подготавливаем страницу активации.";
            setNextStep("Открываем активацию", "Автоматически переходим к статусу подключения…");
            setTimeout(() => {
              const url = new URL(activationPagePath(serviceKey), window.location.origin);
              url.searchParams.set("order_id", id);
              if (linkToken) url.searchParams.set("t", linkToken);
              window.location.href = url.toString();
            }, 1800);
            return true;
          }

          if (deliveryMode === "activation") {
            const hasBundleVpnAccess = await checkBundleVpnAccess(id);
            if (hasBundleVpnAccess) {
              statusEl.className = "status paid";
              statusEl.textContent = "Оплачено. Открываем шаги: VPN + активация подписки...";
              setNextStep("Откроется мастер подключения", "Страница автоматически перейдёт к VPN и активации подписки.");
              setTimeout(() => {
                const url = new URL("/bundle-activation.html", window.location.origin);
                url.searchParams.set("order_id", id);
                if (linkToken) url.searchParams.set("t", linkToken);
                window.location.href = url.toString();
              }, 1200);
              return true;
            }
          }

          statusEl.className = "status paid";
          setPaidReceipt(service, `Заказ ${service.name} создан. Остался последний шаг подключения.`);
          statusEl.textContent = "Платёж подтверждён. Подготавливаем страницу активации.";
          setNextStep("Откроется форма активации", `Через секунду вы автоматически перейдёте к подключению ${service.name}.`);
          setTimeout(() => {
            const url = new URL(activationPagePath(serviceKey), window.location.origin);
            url.searchParams.set("order_id", id);
            if (linkToken) url.searchParams.set("t", linkToken);
            window.location.href = url.toString();
          }, 1200);
          return true;
        }

        if (status === "FAILED" && paymentStatus === "PROCESSING") {
          statusEl.className = "status pending";
          statusTitleEl.textContent = `Оплата ${service.name} обрабатывается`;
          statusLeadEl.textContent = "Платёжная система ещё проверяет поступление средств.";
          statusEl.textContent = "Ожидаем подтверждение платежа от платёжной системы...";
          return false;
        }

        if (status === "FAILED" || status === "REFUNDED") {
          statusEl.className = "status failed";
          statusEl.textContent = status === "REFUNDED" ? "Платеж возвращен." : "Оплата не подтверждена.";
          return true;
        }

        statusEl.className = "status pending";
        statusTitleEl.textContent = `Оплата ${service.name} обрабатывается`;
        statusLeadEl.textContent = "Проверяем платеж через webhook. Обычно это занимает до 30 секунд.";
        statusEl.textContent = "Ожидаем подтверждение платежа...";
        setNextStep("Ожидаем платёжную систему", "Как только платёж подтвердится, мы автоматически покажем следующий шаг.");
        return false;
      } catch (_) {
        return false;
      }
    }

    function normalizeServiceKey(value) {
      const normalized = String(value || "").trim().toLowerCase().replace(/[\s_-]+/g, "");
      if (normalized.includes("itunes") || normalized.includes("appstore") || normalized.includes("appleid")) return "itunes";
      if (normalized.includes("steam") || normalized.includes("mannco")) return "steam";
      if (normalized.includes("perplexity") || normalized.includes("pplx")) return "perplexity";
      if (normalized.includes("claude")) return "claude";
      if (normalized.includes("gemini") || normalized.includes("googleai")) return "gemini";
      if (normalized.includes("suno")) return "suno";
      if (normalized.includes("vpn") || normalized.includes("vless")) return "vpn";
      if (normalized.includes("supergrok") || normalized === "grok") return "grok";
      if (normalized.includes("chatgptgo")) return "chatgptgo";
      if (normalized.includes("chatgptplus")) return "chatgptplus";
      if (normalized.includes("chatgpt") || normalized === "chatgpt") return "chatgpt";
      return "";
    }

    function activationPagePath(serviceKey) {
      return serviceKey === "grok" ? "/supergrok-activation.html" : "/redeem-start.html";
    }

    function serviceConfig(serviceKey) {
      const configs = {
        chatgptgo: {
          name: "ChatGPT GO",
          href: "/chatgpt",
          icon: "/assets/img/services/chatgpt-card.webp?v=20260721-webp1",
          price: 1290,
        },
        chatgptplus: {
          name: "ChatGPT Plus",
          href: "/chatgpt",
          icon: "/assets/img/services/chatgpt-card.webp?v=20260721-webp1",
          price: 2190,
        },
        chatgpt: {
          name: "ChatGPT",
          href: "/chatgpt",
          icon: "/assets/img/services/chatgpt-card.webp?v=20260721-webp1",
          price: 1290,
        },
        claude: {
          name: "Claude",
          href: "/claude",
          icon: "/assets/img/services/claude-card.png",
          price: 2299,
        },
        perplexity: {
          name: "Perplexity Pro",
          href: "/perplexity",
          icon: "/assets/img/services/perplexity-card.webp?v=20260809-perplexity1",
          price: 1999,
        },
        gemini: {
          name: "Gemini Pro",
          href: "/gemini",
          icon: "/assets/img/services/gemini-card.webp",
          price: 1500,
        },
        suno: {
          name: "Suno Premier",
          href: "/suno",
          icon: "/assets/img/services/suno-card-v2.webp?v=20260824-suno-square2",
          price: 2999,
        },
        grok: {
          name: "SuperGrok",
          href: "/supergrok",
          icon: "/assets/img/services/grok-card.png",
          price: 4850,
        },
        itunes: {
          name: "iTunes и App Store",
          href: "/itunes",
          icon: "/assets/img/services/appstore-card-v3.webp",
          price: 300,
        },
        steam: {
          name: "Пополнение Steam",
          href: "/store/steam/",
          icon: "/assets/img/steam/steam-topup-card.webp",
          price: 151,
        },
        vpn: {
          name: "GPTishka VPN",
          href: "/store/vpn/",
          icon: "/assets/img/services/vpn-card.webp",
          price: 0,
        },
      };
      return configs[serviceKey] || { name: "подписки", href: "/catalog/ai/", icon: "", price: 0 };
    }

    function readCheckoutContext() {
      try {
        const raw = String(localStorage.getItem("gptishka_site_checkout_context") || "");
        if (!raw) return null;
        const context = JSON.parse(raw);
        const createdAt = Number(context?.createdAt || 0);
        if (!createdAt || Date.now() - createdAt >= 24 * 60 * 60 * 1000) return null;
        return context;
      } catch (_) {
        return null;
      }
    }

    function resolveServiceKey(payload) {
      const directSignals = [
        payload?.serviceKey,
        payload?.productSlug,
        payload?.productTitle,
        payload?.product,
      ];
      for (const signal of directSignals) {
        const key = normalizeServiceKey(signal);
        if (key) return key;
      }
      const context = readCheckoutContext();
      return normalizeServiceKey(context?.serviceKey || context?.source || "");
    }

    function applyServiceContext(serviceKey) {
      const config = serviceConfig(serviceKey);
      if (serviceKey) {
        serviceNameEl.textContent = config.name;
        if (!previewMode && statusEl.classList.contains("pending")) {
          statusTitleEl.textContent = "Проверяем оплату";
          document.title = `Оплата ${config.name} обрабатывается - GPTишка`;
        }
        tariffLinkEl.href = config.href;
        tariffLinkEl.textContent = `К тарифам ${config.name}`;
        document.body.dataset.paymentService = serviceKey;
      }
      return config;
    }

    function setNextStep(title, text) {
      if (statusRedirectTextEl) statusRedirectTextEl.textContent = String(text || title || "Открываем страницу активации…");
    }

    function setPaidReceipt(service, lead) {
      const safeService = service || serviceConfig("");
      statusKickerEl.textContent = "Операция выполнена";
      statusTitleEl.textContent = "Оплата прошла успешно";
      document.title = `Оплата ${safeService.name} прошла успешно - GPTишка`;
      statusLeadEl.textContent = String(lead || `Заказ ${safeService.name} успешно создан.`);
    }

    function renderPaidPreview(serviceKey) {
      const service = applyServiceContext(serviceKey);
      statusPreviewNoteEl.hidden = false;
      statusKickerEl.textContent = "Операция выполнена";
      statusTitleEl.textContent = "Оплата прошла успешно";
      document.title = `Оплата ${service.name} прошла успешно - GPTишка`;
      statusLeadEl.textContent = `Заказ ${service.name} создан и готов к подключению.`;
      orderIdEl.textContent = "ПРЕДПРОСМОТР";
      emailMaskedEl.textContent = "po***@example.com";
      amountEl.textContent = `${formatAmount(service.price)} RUB`;
      statusEl.className = "status paid";
      statusEl.textContent = "Платёж подтверждён. Подготавливаем страницу активации.";
      setNextStep("Открываем активацию", `В реальном заказе переход к подключению ${service.name} произойдёт автоматически.`);
      if (serviceKey === "chatgptgo" || serviceKey === "chatgptplus" || serviceKey === "grok") {
        tariffLinkEl.href = `${activationPagePath(serviceKey)}?preview=1&service=${encodeURIComponent(serviceKey)}`;
        tariffLinkEl.textContent = `Открыть активацию ${service.name}`;
      }
    }

    async function checkBundleVpnAccess(id) {
      try {
        const url = new URL("/api/vpn/me", window.location.origin);
        url.searchParams.set("order_id", id);
        if (linkToken) url.searchParams.set("t", linkToken);
        const response = await fetch(url.toString(), { cache: "no-store" });
        if (!response.ok) return false;
        const payload = await response.json().catch(() => ({}));
        return Boolean(String(payload?.accessLink || "").trim());
      } catch (_) {
        return false;
      }
    }

    function handlePaidOrder(id) {
      try {
        const lastPaid = String(localStorage.getItem(LAST_PAID_ORDER_KEY) || "").trim();
        if (lastPaid === id) return;
        CART_STORAGE_KEYS.forEach((key) => localStorage.removeItem(key));
        localStorage.setItem(LAST_PAID_ORDER_KEY, id);
      } catch (_) {
        // Ignore storage write errors.
      }
      resetCartUiBadge();
      notifyCartCleared();
    }

    function trackConfirmedPurchase(orderId, payload) {
      const safeOrderId = String(orderId || "").trim();
      if (!safeOrderId) return;

      const trackedKey = `gptishka_ym_purchase_tracked:${safeOrderId}`;
      try {
        if (localStorage.getItem(trackedKey) === "1") return;
      } catch (_) {
        try {
          if (sessionStorage.getItem(trackedKey) === "1") return;
        } catch (_) {
          // Continue without storage-based deduplication.
        }
      }

      const revenue = Math.max(0, Number(payload?.finalAmount || 0));
      const currency = String(payload?.currency || "RUB").trim().toUpperCase() || "RUB";
      const product = payload?.product && typeof payload.product === "object" ? payload.product : {};
      const productId = String(product.id || payload?.planId || "").trim() || "unknown-product";
      const productName = String(product.title || product.slug || productId).trim();
      const attribution = getPurchaseAttribution();
      const goalParams = {
        order_id: safeOrderId,
        revenue,
        currency,
        product_id: productId,
        product_name: productName,
        ...attribution,
      };

      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        ecommerce: {
          currencyCode: currency,
          purchase: {
            actionField: { id: safeOrderId, revenue },
            products: [{ id: productId, name: productName, price: revenue, quantity: 1 }],
          },
        },
      });

      window.ym = window.ym || function () {
        (window.ym.a = window.ym.a || []).push(arguments);
      };
      window.ym.l = window.ym.l || Date.now();
      window.ym(METRIKA_COUNTER_ID, "reachGoal", "ym-purchase", goalParams);

      try {
        localStorage.setItem(trackedKey, "1");
      } catch (_) {
        try {
          sessionStorage.setItem(trackedKey, "1");
        } catch (_) {
          // Ignore storage write errors.
        }
      }
    }

    function getPurchaseAttribution() {
      try {
        if (typeof window.gptishkaGetAttribution !== "function") return {};
        const snapshot = window.gptishkaGetAttribution();
        const touch = snapshot?.lastTouch || snapshot?.session || {};
        return {
          source: String(touch.source || "").slice(0, 120),
          medium: String(touch.medium || "").slice(0, 120),
          utm_campaign: String(touch.utm_campaign || "").slice(0, 300),
          utm_content: String(touch.utm_content || "").slice(0, 300),
          utm_term: String(touch.utm_term || "").slice(0, 300),
          yclid: String(touch.yclid || "").slice(0, 200),
        };
      } catch (_) {
        return {};
      }
    }

    function trackPurchaseRecord(orderId, payload) {
      const safeOrderId = String(orderId || "").trim();
      if (!safeOrderId) return;

      const trackedKey = `gptishka_purchase_tracked:${safeOrderId}`;
      try {
        if (sessionStorage.getItem(trackedKey) === "1") return;
      } catch (_) {
        // Ignore storage read errors.
      }

      const emailCandidates = [
        String(payload?.email || "").trim().toLowerCase(),
        String(localStorage.getItem("checkout_email") || "").trim().toLowerCase(),
      ];
      const email = emailCandidates.find((value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) || "";
      if (!email) return;

      fetch("/api/purchases", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, orderId: safeOrderId }),
        keepalive: true,
      }).catch(() => {
        // Tracking failures must not block activation flow.
      });

      try {
        sessionStorage.setItem(trackedKey, "1");
      } catch (_) {
        // Ignore storage write errors.
      }
    }

    function resetCartUiBadge() {
      const countEl = document.getElementById("headerCartCount");
      const totalEl = document.getElementById("headerCartTotal");
      if (countEl) countEl.textContent = "0";
      if (totalEl) totalEl.textContent = "0 RUB";
    }

    function notifyCartCleared() {
      try {
        window.dispatchEvent(new CustomEvent("gptishka:cart-cleared"));
      } catch (_) {
        // Ignore event dispatch failures.
      }
    }

    function removeInjectedSupportUi() {
      const selector = SUPPORT_WIDGET_SELECTORS.join(",");
      if (selector) document.querySelectorAll(selector).forEach((node) => node.remove());

      document.querySelectorAll('img[src*="assistant-cat-left"], img[src*="assistant-cat"]').forEach((img) => {
        const host = img.closest("aside, section, article, div");
        if (host && !host.classList.contains("status-card")) {
          host.remove();
          return;
        }
        img.remove();
      });

      document.querySelectorAll('a[href*="t.me/aiiisupport"]').forEach((link) => {
        const host = link.closest("aside, section, article, div");
        if (!host || host.classList.contains("status-card")) return;
        host.remove();
      });
    }

    function formatAmount(value) {
      const amount = Number.isFinite(Number(value)) ? Number(value) : 0;
      const hasFraction = Math.abs(amount % 1) > 0.000001;
      return amount.toLocaleString("ru-RU", {
        minimumFractionDigits: hasFraction ? 2 : 0,
        maximumFractionDigits: 2,
      });
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }
  </script>
